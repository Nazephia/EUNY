name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - state_machine

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository and godot-cpp
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SCons
        run: python -m pip install scons

      - name: Install Godot 4.7.2 and export templates
        shell: pwsh
        run: |
          $version = "4.7.2-stable"
          $baseUrl = "https://github.com/godotengine/godot/releases/download/$version"
          $godotArchive = Join-Path $env:RUNNER_TEMP "godot.zip"
          $templatesArchive = Join-Path $env:RUNNER_TEMP "templates.tpz"
          $godotDir = Join-Path $env:RUNNER_TEMP "godot"
          $templatesDir = Join-Path $env:RUNNER_TEMP "templates"

          Invoke-WebRequest "$baseUrl/Godot_v4.7.2-stable_win64.exe.zip" -OutFile $godotArchive
          Invoke-WebRequest "$baseUrl/Godot_v4.7.2-stable_export_templates.tpz" -OutFile $templatesArchive

          Expand-Archive $godotArchive -DestinationPath $godotDir
          Copy-Item $templatesArchive (Join-Path $env:RUNNER_TEMP "templates.zip")
          Expand-Archive (Join-Path $env:RUNNER_TEMP "templates.zip") -DestinationPath $templatesDir

          $templateInstallDir = Join-Path $env:APPDATA "Godot\export_templates\4.7.2.stable"
          New-Item -ItemType Directory -Path $templateInstallDir -Force | Out-Null
          Copy-Item (Join-Path $templatesDir "templates\*") $templateInstallDir -Recurse -Force

          $godot = Get-ChildItem $godotDir -Filter "*win64.exe" | Select-Object -First 1
          if (-not $godot) {
            throw "Godot executable was not found in the downloaded archive."
          }
          "GODOT_EXE=$($godot.FullName)" >> $env:GITHUB_ENV

      - name: Build Windows GDExtension
        run: scons platform=windows target=template_release arch=x86_64

      - name: Import project and export Windows game
        shell: pwsh
        run: |
          $project = Join-Path $PWD "eto-uzhe-ne-ya-"
          & $env:GODOT_EXE --headless --path $project --editor --import --quit
          if ($LASTEXITCODE -ne 0) {
            throw "Godot project import failed with exit code $LASTEXITCODE."
          }

          & $env:GODOT_EXE --headless --path $project --export-release "Windows Desktop" "bin/euny.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "Windows export failed with exit code $LASTEXITCODE."
          }

      - name: Smoke-test exported game
        shell: pwsh
        run: |
          $project = Join-Path $PWD "eto-uzhe-ne-ya-"
          $executable = Join-Path $PWD "eto-uzhe-ne-ya-\bin\euny.exe"
          $logFile = Join-Path $env:RUNNER_TEMP "windows-smoke-test.log"
          & $env:GODOT_EXE --headless --path $project --quit-after 60 --log-file $logFile
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            throw "The Windows project smoke test failed (exit code $exitCode)."
          }
          $log = Get-Content $logFile -Raw
          if ($log -match "Cannot find instance binding callbacks|FlyingSpikes requires") {
            throw "The Windows GDExtension reported missing Godot class bindings."
          }

          Remove-Item $logFile -ErrorAction SilentlyContinue
          $logFile = Join-Path $env:RUNNER_TEMP "exported-smoke-test.log"
          & $executable --headless --quit-after 60 --log-file $logFile
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            throw "The exported Windows game failed to start (exit code $exitCode)."
          }
          $log = Get-Content $logFile -Raw
          if ($log -match "Cannot find instance binding callbacks|FlyingSpikes requires") {
            throw "The exported Windows GDExtension reported missing Godot class bindings."
          }

      - name: Package Windows build
        shell: pwsh
        run: |
          $projectBin = Join-Path $PWD "eto-uzhe-ne-ya-\bin"
          $stageBin = Join-Path $env:RUNNER_TEMP "EUNY-windows-x86_64\bin"
          New-Item -ItemType Directory -Path $stageBin -Force | Out-Null
          Copy-Item (Join-Path $projectBin "euny.exe") $stageBin
          Copy-Item (Join-Path $projectBin "euny.windows.template_release.x86_64.dll") $stageBin
          Compress-Archive -Path (Join-Path $env:RUNNER_TEMP "EUNY-windows-x86_64\bin") `
            -DestinationPath (Join-Path $PWD "EUNY-windows-x86_64.zip") -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: EUNY-windows-x86_64
          path: EUNY-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14
